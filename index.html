<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Cartelera Laboral</title>
</head>

<body>

    <h1>Cartelera Laboral</h1>

    <section id="pantallaLogin">

        <h2>Iniciar sesión</h2>

        <label>Usuario</label>
        <input type="text" id="txtLoginUsuario">
        <br><br>

        <label>Contraseña</label>
        <input type="password" id="txtLoginPassword">
        <br><br>

        <button id="btnLogin">Ingresar</button>

        <button id="btnIrRegistro">Registrarme</button>

        <p id="pLogin"></p>

    </section>

    <section id="pantallaRegistro">

        <h2>Registro de Postulante</h2>

        <label>Usuario</label>
        <input type="text" id="txtUsuario">
        <br><br>

        <label>Contraseña</label>
        <input type="password" id="txtPassword">
        <br><br>

        <label>Nombre completo</label>
        <input type="text" id="txtNombre">
        <br><br>

        <label>Experiencia</label>

        <select id="slcExperiencia">

            <option value="">Seleccione...</option>

            <option value="Junior">Junior</option>

            <option value="Semi-Senior">Semi-Senior</option>

            <option value="Senior">Senior</option>

        </select>

        <br><br>

        <label>Área</label>

        <select id="slcArea">

            <option value="">Seleccione...</option>

            <option value="Tecnología">Tecnología</option>

            <option value="Diseño">Diseño</option>

            <option value="Marketing">Marketing</option>

            <option value="Administración">Administración</option>

            <option value="Otros">Otros</option>

        </select>

        <br><br>

        <button id="btnRegistrar">Registrarse</button>

        <button id="btnVolverLogin">Volver al login</button>

        <p id="pResultado"></p>

    </section>

    <section id="pantallaPostulante">

        <h2>Menú Postulante</h2>

        <p id="pBienvenidaPostulante"></p>

        <button id="btnCerrarSesionPostulante">
            Cerrar sesión
        </button>

    </section>

    <section id="pantallaAdmin">

        <h2>Menú Administrador</h2>

        <p id="pBienvenidaAdmin"></p>

        <button id="btnCerrarSesionAdmin">
            Cerrar sesión
        </button>

    </section>



    <script src="js/script.js"></script>

</body>

</html>
