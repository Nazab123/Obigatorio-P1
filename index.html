<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="styles.css">
    <title>Cartelera Laboral</title>
</head>

<body>

    <h1>Search work</h1>
<div id="contenedorPrincipal"></div>

<!-- LOGIN  -->
<template id="view-login">
    <section>
        <h2>Iniciar sesión</h2>

        <label for="txtUsuarioLogin">Usuario</label>
        <input type="text" id="txtUsuarioLogin">

        <label for="txtPasswordLogin">Contraseña</label>
        <input type="password" id="txtPasswordLogin">

        <button id="btnLogin">Ingresar</button>
        <button id="btnIrRegistro">Registrarme</button>

        <p id="pLogin"></p>
    </section>
</template>

<template id="view-registro">
    <section >
        <h2>Registro de Postulante</h2>

        <label for="txtUsuario">Usuario</label>
        <input type="text" id="txtUsuario">

        <label for="txtPassword">Contraseña</label>
        <input type="password" id="txtPassword">

        <label for="txtNombre">Nombre completo</label>
        <input type="text" id="txtNombre">

        <label for="slcExperiencia">Experiencia</label>
        <select id="slcExperiencia">
            <option value="">Seleccione...</option>
            <option value="Junior">Junior</option>
            <option value="Semi-Senior">Semi-Senior</option>
            <option value="Senior">Senior</option>
        </select>

        <label for="slcArea">Área</label>
        <select id="slcArea">
            <option value="">Seleccione...</option>
            <option value="Tecnología">Tecnología</option>
            <option value="Diseño">Diseño</option>
            <option value="Marketing">Marketing</option>
            <option value="Administración">Administración</option>
            <option value="Otros">Otros</option>
        </select>

        <button id="btnRegistrar">Registrarse</button>
        <button id="btnVolverLogin">Volver al login</button>
        <p id="pResultado"></p>
    </section>
</template>

<template id="view-postulante">

    <nav class="navbar">
        <a href="#" id="btnVerOfertas">Ofertas laborales</a>
        <a href="#" id="btnVerMisPostulaciones">Mis postulaciones</a>
        <a href="#" id="btnVerOfertasDestacadas">Ofertas destacadas</a>
        <a href="#" id="btnCerrarSesionPostulante">Cerrar sesión</a>
    </nav>

    <section id="pantallaPostulante">
        <h2>Menú Postulante</h2>

        <p id="pBienvenidaPostulante"></p>
    </section>

</template>


<template id="view-ofertas-postulante">
   
        <h2>Ofertas laborales activas</h2>
        <label for="slcFiltroOfertas">Filtro</label>
        <select id="slcFiltroOfertas">
            <option value="area">Ver solo mi área</option>
            <option value="todas">Ver todas</option>
        </select>

        
        <button id="btnAplicarFiltroOfertas">Aplicar filtro</button>
         <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>titulo</th>
                <th>empresa</th>
                <th>nivel</th>
                <th>area</th>
                <th>destacada</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>
           <tbody id="tbodyListadoOfertasPostulante"></tbody>

    </table>
        <p id="pOfertasPostulante"></p>

        <button id="btnVolverMenuPostulante1">Volver</button>
    </section>
</template>

<template id="view-mis-postulaciones">
    <section>
        <h2>Mis postulaciones</h2>

        <p id="pMisPostulaciones"></p>

       
         <table>
        <thead>
            <tr>
             <th>ID</th>
             <th>titulo</th>
             <th>empresa</th>
             <th>nivel</th>
             <th>area</th>
             <th>destacada</th>
             <th>Estado</th>
            </tr>
            
        </thead>
           <tbody id="tbodyListadoMisPos"></tbody>

    </table>
    <button id="btnVolverMenuPostulante2">Volver</button>

    </section>
    </template>

<template id="view-ofertas-destacadas">
    <section id="pantallaOfertasDestacadas">
        <h2>Ofertas destacadas</h2>
        <p id="pOfertasDestacadas"></p>

        <table>
         <thead>
            <tr>
             <th>titulo</th>
             <th>empresa</th>
             <th>nivel</th>
             <th>area</th>
             <th>destacada</th>
             <th>Estado</th>
            </tr>
    
         </thead>

           <tbody id="tbodyListadoDestacadas"></tbody>

         </table>
           <button id="btnVolverMenuPostulante3">Volver</button>
        
    </section>
</template>

<template id="view-admin">

    <nav class="navbar">
        <a href="#" id="btnCrearOferta">Crear oferta laboral</a>
        <a href="#" id="btnVerListadoOfertasAdmin">Listado de ofertas</a>
        <a href="#" id="btnVerPostulacionesPendientes">Postulaciones pendientes</a>
        <a href="#" id="btnVerEstadisticasAdmin">Estadísticas</a>
        <a href="#" id="btnCerrarSesionAdmin">Cerrar sesión</a>
    </nav>

    <section id="pantallaAdmin">
        <h2>Menú Administrador</h2>

        <p id="pBienvenidaAdmin"></p>
    </section>

</template>

<template id="view-crear-oferta">

    <section id="pantallaCrearOferta">
        <h2>Crear oferta laboral</h2>

        <label for="txtTituloOferta">Título de la oferta</label>
        <input type="text" id="txtTituloOferta">

        <label for="txtEmpresaOferta">Empresa</label>
        <input type="text" id="txtEmpresaOferta">

        <label for="txtDescripcionOferta">Descripción</label>
        <textarea id="txtDescripcionOferta"></textarea>

        <label for="slcNivelOferta">Nivel requerido</label>
        <select id="slcNivelOferta">
            <option value="">Seleccione...</option>
            <option value="Junior">Junior</option>
            <option value="Semi-Senior">Semi-Senior</option>
            <option value="Senior">Senior</option>
        </select>

        <label for="slcAreaOferta">Área</label>
        <select id="slcAreaOferta">
            <option value="">Seleccione...</option>
            <option value="Tecnología">Tecnología</option>
            <option value="Diseño">Diseño</option>
            <option value="Marketing">Marketing</option>
            <option value="Administración">Administración</option>
            <option value="Otros">Otros</option>
        </select>

        <label for="txtLimitePostulaciones">Límite de postulaciones</label>
        <input type="number" id="txtLimitePostulaciones">

        <label for="txtCantidadVacantes">Cantidad de vacantes</label>
        <input type="number" id="txtCantidadVacantes">

        <label for="slcOfertaDestacada">Oferta destacada</label>
        <select id="slcOfertaDestacada">
            <option value="">Seleccione...</option>
            <option value="si">Sí</option>
            <option value="no">No</option>
        </select>

        <button id="btnGuardarOferta">Guardar oferta</button>
        <button id="btnVolverMenuAdmin1">Volver</button>

        <p id="pCrearOferta"></p>
    </section>
    </template>


<template id="view-table-ofertas-admin">

    <section id="pantallaListadoOfertasAdmin">
        <h2>Listado de ofertas</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>titulo</th>
                <th>empresa</th>
                <th>nivel</th>
                <th>area</th>
                <th>destacada</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>
            <tbody id="tbodyListadoOfertasAdmin"></tbody>

    </table>

        <p id="pListadoOfertasAdmin"></p>
<template id="view-editar-oferta">
    <h3>Editar oferta</h3>

    <input type="hidden" id="txtIdOfertaEditando">

    <label>Título</label>
    <input type="text" id="txtEditarTituloOferta">

    <label>Empresa</label>
    <input type="text" id="txtEditarEmpresaOferta">

    <label>Descripción</label>
    <textarea id="txtEditarDescripcionOferta"></textarea>

    <label>Nivel</label>
    <select id="slcEditarNivelOferta">
        <option value="Junior">Junior</option>
        <option value="Semi-Senior">Semi-Senior</option>
        <option value="Senior">Senior</option>
    </select>

    <label>Área</label>
    <select id="slcEditarAreaOferta">
        <option value="Tecnología">Tecnología</option>
        <option value="Diseño">Diseño</option>
        <option value="Marketing">Marketing</option>
        <option value="Administración">Administración</option>
        <option value="Otros">Otros</option>
    </select>

    <label>Límite postulaciones</label>
    <input type="number" id="txtEditarLimitePostulaciones">

    <label>Cantidad vacantes</label>
    <input type="number" id="txtEditarCantidadVacantes">

    <label>Destacada</label>
    <select id="slcEditarOfertaDestacada">
        <option value="si">Sí</option>
        <option value="no">No</option>
    </select>

    <button id="btnGuardarCambiosOferta">Guardar cambios</button>
    <button id="btnCancelarEditarOferta">Cancelar</button>

    <p id="pEditarOferta"></p>
</div>
</template>

        <button id="btnVolverMenuAdmin2">Volver</button>
    </section>
    </template>
    

<template id="view-postulaciones-pendientes">
    <section id="pantallaPostulacionesPendientes">
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Postulante</th>
                <th>Experiencia</th>
                <th>Área de interes</th>
                <th>Oferta</th>
                <th>Empresa</th>
                <th>Nivel requerido</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody id="tbodyPostulacionesPendientes">

        </tbody>
    </table>

    <p id="pPostulacionesPendientes"></p>

        <button id="btnVolverMenuAdmin3">Volver</button>
    </section>
</template>

<template id="view-estadisticas-admin">
    <section id="pantallaEstadisticasAdmin">
        <h2>Estadísticas del sistema</h2>

        <label for="txtBuscarOfertaEstadistica">Buscar oferta por título</label>
        <input type="text" id="txtBuscarOfertaEstadistica">
        <button id="btnBuscarOfertaEstadistica">Buscar</button>

<h3>Postulaciones por oferta</h3>

<table>
    <thead>
        <tr>
            <th>Título de la oferta</th>
            <th>Pendientes</th>
            <th>Aceptadas</th>
            <th>Rechazadas</th>
            <th>Total</th>
        </tr>
    </thead>

    <tbody id="tbodyPostulacionesPorOferta">

    </tbody>
</table>

        <h3>Total de ofertas por estado</h3>
        <p id="pTotalOfertasPorEstado"></p>

        <h3>Porcentaje de vacantes cubiertas</h3>
        <p id="pPorcentajeVacantesCubiertas"></p>

        <h3>Postulante con más postulaciones activas</h3>
        <p id="pPostulanteMasPostulaciones"></p>

        <button id="btnVolverMenuAdmin4">Volver</button>
    </section>
</template>
